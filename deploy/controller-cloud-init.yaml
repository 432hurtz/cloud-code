#cloud-config
# Provisions the always-on controller: installs the Telegram poller and runs it
# as a service. Reads its config from instance user-data (set by create-controller.sh).
# requests is installed via apt (python3-requests) rather than pip so it reliably
# lands on the system python3 the service uses. After provisioning it self-reports
# status to Telegram (there's no inbound SSH by default, so this is the log channel).
package_update: true
packages:
  - python3-requests
  - curl
  - jq

write_files:
  - path: /etc/systemd/system/code-controller.service
    content: |
      [Unit]
      Description=Telegram controller (starts the GPU builder)
      After=network-online.target
      Wants=network-online.target
      [Service]
      # scw needs HOME to locate its config; systemd doesn't set it by default.
      Environment=HOME=/root
      EnvironmentFile=/opt/controller/env
      ExecStart=/usr/bin/python3 /opt/controller/poller.py
      Restart=always
      RestartSec=5
      [Install]
      WantedBy=multi-user.target

runcmd:
  - curl -fsSL https://raw.githubusercontent.com/scaleway/scaleway-cli/master/scripts/get.sh | sh
  # Belt-and-suspenders: if apt didn't provide requests, fall back to pip.
  - python3 -c "import requests" 2>/dev/null || pip3 install --quiet requests || true
  - mkdir -p /opt/controller
  - curl -s http://169.254.42.42/user_data/poller-b64 | base64 -d > /opt/controller/poller.py
  - |
    U=http://169.254.42.42/user_data
    cat > /opt/controller/env <<EOF
    TELEGRAM_BOT_TOKEN=$(curl -s $U/telegram-bot-token)
    TELEGRAM_TOKEN_SECRET_ID=$(curl -s $U/telegram-token-secret-id)
    TELEGRAM_CHAT_ID=$(curl -s $U/telegram-chat-id)
    BUILDER_ID=$(curl -s $U/builder-id)
    SCW_ZONE=$(curl -s $U/scw-zone)
    SCW_ACCESS_KEY=$(curl -s $U/scw-access-key)
    SCW_SECRET_KEY=$(curl -s $U/scw-secret-key)
    SCW_DEFAULT_PROJECT_ID=$(curl -s $U/scw-project-id)
    SCW_DEFAULT_ZONE=$(curl -s $U/scw-zone)
    EOF
  - systemctl daemon-reload
  - systemctl enable --now code-controller.service
  # Self-report provisioning result to Telegram (no inbound SSH → this is the log channel).
  - |
    U=http://169.254.42.42/user_data
    TOK=$(curl -s $U/telegram-bot-token); CHAT=$(curl -s $U/telegram-chat-id)
    sleep 10
    ST=$(systemctl is-active code-controller.service 2>&1)
    LOG=$(journalctl -u code-controller.service --no-pager -n 15 2>&1 | tail -c 1500)
    curl -s "https://api.telegram.org/bot${TOK}/sendMessage" \
      --data-urlencode "chat_id=${CHAT}" \
      --data-urlencode "text=🔧 Controller provisioning finished. service=${ST}
    --- last log ---
    ${LOG}" >/dev/null 2>&1 || true
