#cloud-config
# First-boot provisioning for the Scaleway GPU builder. Installs the model
# server + tools, unpacks the agent code (from user-data), pulls the model onto
# the persistent root volume, and installs a systemd service that runs the build
# on EVERY boot (Scaleway cloud-init itself only runs once).
package_update: true
packages:
  - tor
  - age
  - python3-pip
  - curl
  - jq

write_files:
  # Per-boot build logic. Reads the task from instance user-data, builds it,
  # encrypts + emails the result, then stops the instance so it never idles.
  - path: /opt/agent-run/run.sh
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      set -uo pipefail
      MD="http://169.254.42.42/user_data"
      ud() { curl -s "${MD}/$1" 2>/dev/null; }
      secret() { [ -z "$1" ] && return 1; scw secret version access "$1" revision=latest_enabled -o json 2>/dev/null | jq -r '.data' | base64 -d; }

      ID=$(curl -s "http://169.254.42.42/conf?format=json" 2>/dev/null | jq -r '.id // empty')
      export SCW_ACCESS_KEY=$(ud scw-access-key)
      export SCW_SECRET_KEY=$(ud scw-secret-key)
      export SCW_DEFAULT_PROJECT_ID=$(ud scw-project-id)
      export SCW_DEFAULT_ZONE=$(ud scw-zone)

      # Always stop the instance on exit so a Spot/idle box can't keep billing.
      self_stop() {
        if [ -n "$ID" ]; then
          scw instance server stop "$ID" zone="$SCW_DEFAULT_ZONE" >/dev/null 2>&1 || poweroff
        else
          poweroff
        fi
      }
      trap self_stop EXIT

      BUILD_TASK=$(ud build-task)
      if [ -z "$BUILD_TASK" ]; then echo "no build-task; stopping."; exit 0; fi
      export BUILD_TASK

      export MODEL=$(ud model)
      export EMAIL_TO=$(ud email-to)         EMAIL_FROM=$(ud email-from)
      export SMTP_HOST=$(ud smtp-host)       SMTP_PORT=$(ud smtp-port)
      export SMTP_USER=$(ud smtp-user)
      SMTP_PW_SID=$(ud smtp-password-secret-id)
      if [ -n "$SMTP_PW_SID" ]; then export SMTP_PASSWORD=$(secret "$SMTP_PW_SID"); else export SMTP_PASSWORD=$(ud smtp-password); fi
      TG_SID=$(ud telegram-token-secret-id)
      if [ -n "$TG_SID" ]; then export TELEGRAM_BOT_TOKEN=$(secret "$TG_SID"); else export TELEGRAM_BOT_TOKEN=$(ud telegram-bot-token); fi
      export TELEGRAM_CHAT_ID=$(ud telegram-chat-id)
      export ENABLE_RESEARCH=$(ud enable-research)
      export RESEARCH_MAX_RESULTS=$(ud research-max-results)
      export GUARDRAIL_MODE=$(ud guardrail-mode)
      export GUARDRAIL_POLICY=$(ud guardrail-policy)
      export GUARDRAIL_BLOCK=$(ud guardrail-block)
      export AGENT_INSTRUCTIONS=$(ud agent-instructions)
      export RECIPIENT_AGE_PUBKEY=$(ud recipient-age-pubkey)
      export VM_AGE_IDENTITY_FILE=/opt/vm_age_key.txt

      # Anti-runaway watchdog: force-stop after MAX_RUNTIME_MIN no matter what.
      MAX=$(ud max-runtime-min); MAX=${MAX:-60}
      (
        sleep $(( MAX * 60 ))
        if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
          curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=⏱️ Hard timeout ${MAX}m — force-stopping the builder." >/dev/null 2>&1 || true
        fi
        [ -n "$ID" ] && scw instance server stop "$ID" zone="$SCW_DEFAULT_ZONE" >/dev/null 2>&1 || poweroff
      ) &

      systemctl start tor 2>/dev/null || service tor start || true
      systemctl start ollama 2>/dev/null || { pgrep -x ollama >/dev/null || nohup ollama serve >/var/log/ollama.log 2>&1 & }
      for _ in $(seq 1 60); do curl -sf http://localhost:11434/api/tags >/dev/null && break; sleep 2; done

      python3 /opt/agent/build_and_send.py

      # Clear the task so a stray reboot doesn't rebuild it.
      [ -n "$ID" ] && scw instance user-data set server-id="$ID" key=build-task content="" zone="$SCW_DEFAULT_ZONE" >/dev/null 2>&1 || true
      echo "build complete; stopping."

  - path: /etc/systemd/system/code-builder.service
    content: |
      [Unit]
      Description=Code builder (runs on every boot)
      After=cloud-final.service network-online.target
      Wants=network-online.target
      [Service]
      Type=oneshot
      ExecStart=/opt/agent-run/run.sh
      TimeoutStartSec=0
      [Install]
      WantedBy=multi-user.target

runcmd:
  # Model server
  - curl -fsSL https://ollama.com/install.sh | sh
  # Scaleway CLI (for self-stop + clearing the task)
  - curl -fsSL https://raw.githubusercontent.com/scaleway/scaleway-cli/master/scripts/get.sh | sh
  # Keep Tor to relays on 80/443 so it works within the egress allowlist
  - echo "FascistFirewall 1" >> /etc/tor/torrc
  # Agent Python deps
  - pip3 install --quiet aider-chat "requests[socks]" beautifulsoup4
  # Unpack the agent code shipped in user-data as a base64 tarball
  - mkdir -p /opt/agent
  - curl -s http://169.254.42.42/user_data/agent-tar-b64 | base64 -d | tar xzf - --strip-components=1 -C /opt/agent
  # Pre-pull the model onto the persistent root volume (first boot only)
  - systemctl start ollama || (nohup ollama serve >/var/log/ollama.log 2>&1 &)
  - sleep 8
  - ollama pull "$(curl -s http://169.254.42.42/user_data/model)"
  # Enable the per-boot build service
  - systemctl daemon-reload
  - systemctl enable code-builder.service
